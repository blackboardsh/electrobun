name: Install Dash
description: Install a published Dash CLI channel for Electrobun builds

inputs:
  channel:
    description: Dash release channel
    required: false
    default: production

runs:
  using: composite
  steps:
    - name: Install Dash
      if: runner.os != 'Windows'
      shell: bash
      env:
        DASH_INSTALL_CHANNEL: ${{ inputs.channel }}
      run: |
        installer="$RUNNER_TEMP/install-dash.sh"
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
          https://electrobun-artifacts.blackboard.sh/dash-cli/install.sh \
          --output "$installer"
        sh "$installer" --channel "$DASH_INSTALL_CHANNEL" --no-modify-path
        echo "$HOME/.dash/bin" >> "$GITHUB_PATH"

    - name: Install Dash
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        DASH_INSTALL_CHANNEL: ${{ inputs.channel }}
      run: |
        $installer = Join-Path $env:RUNNER_TEMP "install-dash.ps1"
        Invoke-WebRequest -UseBasicParsing `
          -Uri "https://electrobun-artifacts.blackboard.sh/dash-cli/install.ps1" `
          -OutFile $installer
        & $installer -Channel $env:DASH_INSTALL_CHANNEL
        if ($LASTEXITCODE -ne 0) { throw "Dash installation failed" }
        (Join-Path $HOME ".dash\bin") | Out-File -FilePath $env:GITHUB_PATH -Append
