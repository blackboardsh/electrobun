name: Saved desktop OCR replay diagnostics

on:
  workflow_dispatch:
    inputs:
      runners:
        description: Accepted for compatibility; replay covers both Windows architectures
        type: string
        default: windows
      scenarios:
        description: Accepted for compatibility; replay uses kitchen-native-ui
        type: string
        default: kitchen-native-ui
      source_run:
        description: Run containing the saved source smoke screenshots
        type: string
        default: '41794831289'

permissions:
  contents: read
  actions: read

jobs:
  replay:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x64
          - runner: windows-11-arm
            platform: windows-arm64
    runs-on: ${{ matrix.runner }}
    env:
      SOURCE_RUN: ${{ inputs.source_run }}
      SOURCE_ARTIFACT: source-smoke-screenshots-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install original Windows OCR toolchain
        shell: pwsh
        run: |
          $tesseract = 'C:\Program Files\Tesseract-OCR\tesseract.exe'
          foreach ($attempt in 1..3) {
            choco install tesseract --yes --no-progress
            if (Test-Path $tesseract) { & $tesseract --version; if ($LASTEXITCODE -eq 0) { break } }
            if ($attempt -eq 3) { throw 'Tesseract installation failed' }
            Start-Sleep -Seconds (20 * $attempt)
          }
          "SMOKE_TESSERACT=$tesseract" >> $env:GITHUB_ENV
          python -m pip install Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download original saved screenshots
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'ocr-source'
          gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name $env:SOURCE_ARTIFACT --dir $source
          exit $LASTEXITCODE
      - name: Replay complete negative OCR within original budget
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'ocr-source'
          $output = Join-Path $env:RUNNER_TEMP 'ocr-replay'
          python scripts/desktop-smoke/replay_ocr.py $source $output
          exit $LASTEXITCODE
      - name: Upload saved-frame OCR timings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: saved-ocr-replay-${{ matrix.platform }}
          path: ${{ runner.temp }}/ocr-replay/**
          if-no-files-found: warn
          retention-days: 14
