name: Beta.8 Windows native UI event and frame timing diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    env:
      SMOKE_SCENARIOS: kitchen-native-ui
      ARTIFACT_RUN_ID: '40964564750'
      ARTIFACT_SHA: '3c4b81a8eaaa141029a1c273f2522e77a59ac5ac'
      ARTIFACT_ARCH: ${{ endsWith(matrix.platform, 'arm64') && 'arm64' || 'x64' }}
      PROBE_RUNNER: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Windows ARM uses x64 Python for pywinpty; Hutch and apps stay ARM64.
        # Intel desktop validation uses macOS 15 because stock Cocoa fullscreen
        # also fails on the hosted macOS 26 Intel image (IconServices).
        # Related runner graphics issue:
        # https://github.com/actions/runner-images/issues/14751
        include:
          - runner: windows-2025
            platform: windows-x64
            python: x64
          - runner: windows-11-arm
            platform: windows-arm64
            python: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - name: Verify native macOS runner architecture
        if: runner.os == 'macOS'
        shell: bash
        env:
          EXPECTED_ARCH: ${{ endsWith(matrix.platform, 'arm64') && 'arm64' || 'x64' }}
        run: |
          expected_machine=x86_64
          if [[ "$EXPECTED_ARCH" == arm64 ]]; then expected_machine=arm64; fi
          test "$(uname -m)" = "$expected_machine"
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" != 1
          node -e 'if (process.arch !== process.env.EXPECTED_ARCH) throw new Error(`Expected native ${process.env.EXPECTED_ARCH} Node, got ${process.arch}`)'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python }}
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "Disk space before cleanup:"
          df -h /
          # Remove large preinstalled software we don't need
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "Disk space after cleanup:"
          df -h /

      - name: Free disk space (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h /
          # Keep the selected Xcode, but remove the other full Xcode installs
          # preloaded on GitHub's macOS image. Kitchen only needs the selected
          # macOS SDK and its multiple signed bundles otherwise exhaust the
          # runner disk while hdiutil creates the final image.
          selected_xcode_root="$(cd "$(xcode-select -p)/../.." && pwd -P)"
          case "$selected_xcode_root" in
            /Applications/Xcode*.app) ;;
            *)
              echo "Refusing to remove Xcode installs: unexpected selected Xcode root: $selected_xcode_root" >&2
              exit 1
              ;;
          esac
          echo "Preserving selected Xcode: $selected_xcode_root"
          for xcode_root in /Applications/Xcode_*.app; do
            [[ -d "$xcode_root" && ! -L "$xcode_root" ]] || continue
            resolved_xcode_root="$(cd "$xcode_root" && pwd -P)"
            case "$resolved_xcode_root" in
              /Applications/Xcode_*.app) ;;
              *)
                echo "Refusing to remove unexpected Xcode root: $resolved_xcode_root" >&2
                exit 1
                ;;
            esac
            if [[ "$resolved_xcode_root" != "$selected_xcode_root" ]]; then
              echo "Removing unused Xcode: $resolved_xcode_root"
              sudo rm -rf "$resolved_xcode_root"
            fi
          done
          # Remove Xcode caches and simulators to free space.
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData" || true
          rm -rf "$HOME/Library/Developer/Xcode/Archives" || true
          rm -rf "$HOME/Library/Developer/Xcode/iOS DeviceSupport" || true
          sudo rm -rf /Library/Developer/CoreSimulator/Caches || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          # Clear common caches.
          rm -rf "$HOME/Library/Caches" || true
          rm -rf "$HOME/Library/Logs" || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Install Linux desktop tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libpipewire-0.3-dev build-essential cmake pkg-config libvulkan1 mesa-vulkan-drivers xvfb xauth openbox dbus-x11 xdotool scrot python3-tk tesseract-ocr
      - name: Install macOS OCR
        if: runner.os == 'macOS'
        uses: ./.github/actions/install-macos-ocr
      - name: Install Windows OCR
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Chocolatey can exit 0 after a feed timeout without installing the
          # package, so retry until the binary itself runs.
          $tesseract = 'C:\Program Files\Tesseract-OCR\tesseract.exe'
          foreach ($attempt in 1..3) {
            choco install tesseract --yes --no-progress
            if (Test-Path $tesseract) { & $tesseract --version; if ($LASTEXITCODE -eq 0) { break } }
            if ($attempt -eq 3) { throw 'Tesseract installation failed' }
            Start-Sleep -Seconds (20 * $attempt)
          }
          "SMOKE_TESSERACT=$tesseract" >> $env:GITHUB_ENV
      - name: Install desktop driver
        run: python -m pip install -r scripts/desktop-smoke/requirements.txt
      - name: Check desktop driver regressions
        shell: bash
        run: |
          python scripts/desktop-smoke/test_desktop.py
          python scripts/desktop-smoke/test_picker.py
      - name: Prepare Windows desktop shell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Windows ARM images can leave first-sign-in privacy setup covering
          # all app windows and blocking Shell_NotifyIcon, even with Explorer
          # running. Suppress that experience on this disposable CI machine.
          # https://learn.microsoft.com/windows/client-management/mdm/policy-csp-privacy#disableprivacyexperience
          foreach ($root in @('HKLM:', 'HKCU:')) {
            $policy = "$root\SOFTWARE\Policies\Microsoft\Windows\OOBE"
            New-Item -Path $policy -Force | Out-Null
            New-ItemProperty -Path $policy -Name DisablePrivacyExperience -Value 1 -PropertyType DWord -Force | Out-Null
          }
          $runnerSession = (Get-Process -Id $PID).SessionId
          $setupProcesses = Get-Process -Name UserOOBEBroker,CloudExperienceHostBroker,WWAHost -ErrorAction SilentlyContinue | Where-Object SessionId -eq $runnerSession
          if ($setupProcesses) {
            $setupProcesses | Stop-Process -Force
            Start-Sleep -Seconds 3
          }
          # First-login setup can leave a Start menu flyout covering the apps.
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
          [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
          Start-Sleep -Seconds 1
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class DesktopShell {
            [DllImport("user32.dll", CharSet = CharSet.Unicode)]
            public static extern IntPtr FindWindow(string className, string title);
          }
          '@
          Write-Host "Runner session: $((Get-Process -Id $PID).SessionId)"
          if ([DesktopShell]::FindWindow('Shell_TrayWnd', $null) -eq [IntPtr]::Zero) {
            Write-Host 'Starting Explorer for notification-area tests.'
            Start-Process "$env:WINDIR\explorer.exe"
          }
          $deadline = (Get-Date).AddSeconds(30)
          while ([DesktopShell]::FindWindow('Shell_TrayWnd', $null) -eq [IntPtr]::Zero) {
            if ((Get-Date) -gt $deadline) {
              throw 'Windows shell notification area is unavailable in the runner session.'
            }
            Start-Sleep -Milliseconds 500
          }
          Write-Host 'Windows shell notification area is ready.'

      - uses: ./.github/actions/install-hutch
        with:
          channel: canary
      - name: Install the package-pinned Hutch before resolving its executable
        working-directory: package
        run: hutch self path 0.28.2
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ endsWith(matrix.platform, 'arm64') && 'arm64' || 'x64' }}
      - name: Verify exact beta.8 release artifact provenance
        id: artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Windows
          test "$SMOKE_SCENARIOS" = kitchen-native-ui
          mkdir -p "$RUNNER_TEMP/desktop-smoke-results/artifact-provenance"
          git diff --exit-code "$ARTIFACT_SHA" HEAD -- package
          git diff --exit-code "$ARTIFACT_SHA" HEAD -- kitchen ':(exclude)kitchen/src/tests/interactive/native-ui.test.tsx'
          git diff "$ARTIFACT_SHA" HEAD -- kitchen/src/tests/interactive/native-ui.test.tsx > "$RUNNER_TEMP/desktop-smoke-results/artifact-provenance/fixture-diagnostic.patch"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" > "$RUNNER_TEMP/desktop-smoke-results/artifact-provenance/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID/jobs?per_page=100&filter=all" > "$RUNNER_TEMP/desktop-smoke-results/artifact-provenance/jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/desktop-smoke-results/artifact-provenance/artifacts.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const read = name => JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'desktop-smoke-results/artifact-provenance', name + '.json'), 'utf8'));
          const run = read('run');
          assert.equal(String(run.id), process.env.ARTIFACT_RUN_ID);
          assert.equal(run.path, '.github/workflows/release.yml');
          assert.equal(run.head_sha, process.env.ARTIFACT_SHA);
          assert.equal(run.head_repository.full_name, process.env.GITHUB_REPOSITORY);
          const arch = process.env.ARTIFACT_ARCH;
          assert.equal(process.platform, 'win32');
          assert.equal(process.arch, arch);
          const buildName = `build (${process.env.PROBE_RUNNER}, win32, ${arch}, win, win)`;
          assert.ok(read('jobs').jobs.some(job => job.name === buildName && job.conclusion === 'success'), 'Missing successful matching release build');
          const ids = ['core', 'cef'].map(kind => {
            const candidates = read('artifacts').artifacts.filter(item => item.name === `electrobun-${kind}-win-${arch}`);
            assert.equal(candidates.length, 1);
            const artifact = candidates[0];
            assert.equal(artifact.expired, false);
            assert.equal(String(artifact.workflow_run.id), process.env.ARTIFACT_RUN_ID);
            assert.equal(artifact.workflow_run.head_sha, process.env.ARTIFACT_SHA);
            return artifact.id;
          });
          appendFileSync(process.env.GITHUB_OUTPUT, `ids=${ids.join(',')}\n`);
          JS
      - name: Download exact beta.8 core and CEF artifacts
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ steps.artifacts.outputs.ids }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
          path: diagnostic-artifacts
          merge-multiple: true
      - name: Stage and verify unchanged beta.8 native devkit
        shell: bash
        run: |
          set -euo pipefail
          test ! -e package/dist
          mkdir -p package/dist
          tar -xzf "diagnostic-artifacts/electrobun-core-win-$ARTIFACT_ARCH.tar.gz" -C package/dist
          tar -xzf "diagnostic-artifacts/electrobun-cef-win-$ARTIFACT_ARCH.tar.gz" -C package/dist
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { validateNativeDevkitManifest } from './package/scripts/validate-native-devkit.mjs';
          import { validateWindowsReleaseArchitecture } from './package/scripts/windows-binary-architecture.mjs';
          const arch = process.env.ARTIFACT_ARCH;
          validateNativeDevkitManifest({ coreRoot: 'package/dist', expectedVersion: '2.0.6-beta.8', expectedTarget: { os: 'win', arch } });
          assert.ok(validateWindowsReleaseArchitecture('package/dist', arch) > 0);
          const hashes = Object.fromEntries(['core', 'cef'].map(kind => {
            const file = `electrobun-${kind}-win-${arch}.tar.gz`;
            return [file, createHash('sha256').update(readFileSync(join('diagnostic-artifacts', file))).digest('hex')];
          }));
          writeFileSync(join(process.env.RUNNER_TEMP, 'desktop-smoke-results/artifact-provenance/archive-sha256.json'), JSON.stringify(hashes, null, 2));
          JS
      - name: Check native text bitmap (macOS)
        if: runner.os == 'macOS'
        working-directory: package
        run: node scripts/run-bun-test.js src/sdks/main/__tests__/native-text-bitmap.test.ts
      - name: Smoke source templates (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          XDG_SESSION_TYPE: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' bash -eo pipefail -c '
            openbox > "$RUNNER_TEMP/openbox-smoke.log" 2>&1 &
            mkdir -p "$RUNNER_TEMP/desktop-smoke-results"
            python scripts/desktop-smoke/preflight.py "$RUNNER_TEMP/desktop-smoke-results" 2>&1 | tee "$RUNNER_TEMP/desktop-smoke-results/preflight.log"
            node scripts/desktop-smoke/source-run.mjs "$RUNNER_TEMP/desktop-smoke-results"
          '
      - name: Smoke source templates (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-smoke-results"
          python scripts/desktop-smoke/preflight.py "$RUNNER_TEMP/desktop-smoke-results" 2>&1 | tee "$RUNNER_TEMP/desktop-smoke-results/preflight.log"
          node scripts/desktop-smoke/source-run.mjs "$RUNNER_TEMP/desktop-smoke-results"
      - name: Smoke source templates (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EBUI_HOST_DEBUG: '1'
          EBUI_EVENT_TIMING: '1'
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'desktop-smoke-results'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          python scripts/desktop-smoke/preflight.py "$output" 2>&1 | Tee-Object -FilePath "$output/preflight.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/desktop-smoke/source-run.mjs "$output"
          exit $LASTEXITCODE
      - name: Upload screenshots and logs
        if: always()
        id: artifact
        uses: actions/upload-artifact@v6
        with:
          name: source-smoke-screenshots-${{ matrix.platform }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/desktop-smoke-results/**
            !${{ runner.temp }}/desktop-smoke-results/scratch-*/**
      - name: Link screenshot artifact
        if: always() && steps.artifact.outputs.artifact-url != ''
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: echo "[Download screenshots and logs]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
