name: macOS fullscreen diagnostic

on:
  workflow_dispatch:
    inputs:
      integration_runner:
        description: Native macOS runner for the Electrobun integration cases
        type: choice
        options:
          - macos-26-intel
          - macos-15-intel
          - macos-26
          - macos-15
        default: macos-26
      artifact_run_id:
        description: Release run containing the immutable core and CEF artifacts
        required: true
        default: '43200214270'
      artifact_sha:
        description: Exact commit which produced those artifacts
        required: true
        default: '146da4c44a13ac1ae761696e1a578bb98d7a0aea'
      rebuild_native:
        description: Rebuild the native window wrapper from this checkout
        type: boolean
        default: false
      rebuild_debug_core:
        description: Replace only Core with a Debug build of the artifact's exact source
        type: boolean
        default: false
      use_vm_temp_dir:
        description: Use the full VM suite's temporary directory for tools and app processes
        type: boolean
        default: false
      full_suite:
        description: Run the full Bun native and CEF Kitchen suites, retaining the prelude and owned-app samples
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: fullscreen-intel-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stock-cocoa:
    if: ${{ !inputs.rebuild_debug_core }}
    name: Stock Cocoa (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            arch: x64
            machine: x86_64
          - runner: macos-15-intel
            arch: x64
            machine: x86_64
          - runner: macos-26
            arch: arm64
            machine: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    env:
      FULLSCREEN_DIAGNOSTICS: ${{ github.workspace }}/fullscreen-stock-diagnostics
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - name: Verify native control runner
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" != 1
          node -e 'if (process.arch !== process.env.EXPECTED_ARCH) throw new Error("Unexpected Node architecture")'
      - name: Run normal and hidden stock Cocoa controls
        run: node package/scripts/fullscreen-intel-diagnostic.mjs stock-only
      - name: Retain stock Cocoa diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fullscreen-stock-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ env.FULLSCREEN_DIAGNOSTICS }}/**
  fullscreen:
    runs-on: ${{ inputs.integration_runner }}
    timeout-minutes: 75
    env:
      ELECTROBUN_BUILD_ARCH: ${{ endsWith(inputs.integration_runner, '-intel') && 'x64' || 'arm64' }}
      ELECTROBUN_DEBUG_FULLSCREEN: '1'
      HUTCH_NO_UPDATE_CHECK: '1'
      FULLSCREEN_DIAGNOSTICS: ${{ github.workspace }}/fullscreen-diagnostics
      ELECTROBUN_DIAGNOSTICS_TEMP: ${{ github.workspace }}/fullscreen-owned-app-diagnostics
      HUTCH_ELECTROBUN_DEVKIT_ROOT: ${{ github.workspace }}/package/dist
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - name: Verify native runner and source artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_SHA: ${{ inputs.artifact_sha }}
          REBUILD_DEBUG_CORE: ${{ inputs.rebuild_debug_core }}
          EXPECTED_MACHINE: ${{ endsWith(inputs.integration_runner, '-intel') && 'x86_64' || 'arm64' }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" != 1
          node -e 'if (process.arch !== process.env.ELECTROBUN_BUILD_ARCH) throw new Error("Unexpected Node architecture")'
          mkdir -p "$FULLSCREEN_DIAGNOSTICS" "$ELECTROBUN_DIAGNOSTICS_TEMP"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" > "$FULLSCREEN_DIAGNOSTICS/artifact-run.json"
          node -e 'const fs = require("fs"); const run = JSON.parse(fs.readFileSync(process.env.FULLSCREEN_DIAGNOSTICS + "/artifact-run.json")); if (run.head_sha !== process.env.ARTIFACT_SHA || run.path !== ".github/workflows/release.yml") throw new Error("Unexpected artifact source run")'
          git rev-parse HEAD > "$FULLSCREEN_DIAGNOSTICS/diagnostic-source-sha.txt"
          for source in package/src/shared/cef-version.ts package/src/shared/build-dependencies.ts; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/$source?ref=$ARTIFACT_SHA" > "$RUNNER_TEMP/artifact-source"
            cmp "$source" "$RUNNER_TEMP/artifact-source"
          done
          if [[ "$REBUILD_DEBUG_CORE" == true ]]; then
            gh api "repos/$GITHUB_REPOSITORY/contents/package/src?ref=$ARTIFACT_SHA" --jq '.[] | select(.name == "core" and .type == "dir") | .sha' > "$FULLSCREEN_DIAGNOSTICS/artifact-core-tree-sha.txt"
          fi
      - name: Use full VM temporary directory
        if: inputs.use_vm_temp_dir
        shell: bash
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
          name: electrobun-core-darwin-${{ env.ELECTROBUN_BUILD_ARCH }}
          path: diagnostic-artifacts
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
          name: electrobun-cef-darwin-${{ env.ELECTROBUN_BUILD_ARCH }}
          path: diagnostic-artifacts
      - uses: ./.github/actions/install-hutch
        with:
          channel: canary
      - uses: mlugg/setup-zig@v2
        if: inputs.rebuild_debug_core
        with:
          version: 0.17.0
      - name: Check diagnostic plans
        run: node --test package/scripts/fullscreen-intel-diagnostic.test.mjs
      - name: Stage immutable devkit and apply selected diagnostic rebuilds
        timeout-minutes: 15
        shell: bash
        env:
          REBUILD_NATIVE: ${{ inputs.rebuild_native }}
          REBUILD_DEBUG_CORE: ${{ inputs.rebuild_debug_core }}
        run: node package/scripts/fullscreen-intel-diagnostic.mjs prepare 2>&1 | tee "$FULLSCREEN_DIAGNOSTICS/prepare.log"
      - name: Install Kitchen dependencies
        working-directory: kitchen
        run: hutch run install
      - name: Build focused Kitchen variants
        working-directory: kitchen
        timeout-minutes: 5
        run: hutch scripts/kitchen-matrix.ts --build-only --with=bun:native,bun:cef --jobs=2
      - name: Verify packaged native binaries
        run: node package/scripts/verify-macho-deployment-target.js --arch="$ELECTROBUN_BUILD_ARCH" kitchen/build/matrix
      - name: Run Kitchen diagnosis
        timeout-minutes: ${{ inputs.full_suite && 45 || 15 }}
        env:
          DIAGNOSTIC_MODE: ${{ inputs.full_suite && 'run-full' || 'run' }}
        run: node package/scripts/fullscreen-intel-diagnostic.mjs "$DIAGNOSTIC_MODE"
      - name: Retain fullscreen diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fullscreen-${{ inputs.integration_runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ env.FULLSCREEN_DIAGNOSTICS }}/**
            !${{ env.FULLSCREEN_DIAGNOSTICS }}/build/**
            ${{ env.ELECTROBUN_DIAGNOSTICS_TEMP }}/**
            kitchen/test-results/**
