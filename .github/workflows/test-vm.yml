name: Intel beta.8 centering diagnostic

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Fresh full-suite launches per variant (1 to 20; stop at first failure)
        type: number
        default: 10

permissions:
  contents: read

concurrency:
  group: centering-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Centering (${{ matrix.variant }})
    runs-on: macos-15-intel
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: odin:system
            bundle: odin-native
          - variant: go:cef
            bundle: go-cef
    env:
      ELECTROBUN_BUILD_ARCH: x64
      ELECTROBUN_DEBUG_FULLSCREEN: '1'
      HUTCH_NO_UPDATE_CHECK: '1'
      HUTCH_ELECTROBUN_DEVKIT_ROOT: ${{ github.workspace }}/package/dist
      PROBE_VARIANT: ${{ matrix.variant }}
      PROBE_BUNDLE: ${{ matrix.bundle }}
      PROBE_ROUNDS: ${{ inputs.rounds }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: package/package-lock.json
      - name: Verify native Intel runner and beta.8 diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" != 1
          node -e 'if (process.platform !== "darwin" || process.arch !== "x64") throw new Error("Expected native Intel macOS Node")'
          case "$PROBE_ROUNDS" in
            ''|*[!0-9]*) echo 'rounds must be an integer from 1 to 20' >&2; exit 1 ;;
          esac
          test "$PROBE_ROUNDS" -ge 1
          test "$PROBE_ROUNDS" -le 20
          git merge-base --is-ancestor 3c4b81a8eaaa141029a1c273f2522e77a59ac5ac HEAD
          node -e 'if (require("./package/package.json").version !== "2.0.6-beta.8") throw new Error("Expected beta.8 diagnostic source")'
          probe_root="$RUNNER_TEMP/macos-centering-probe"
          mkdir -p "$probe_root"
          touch "$probe_root/started"
          git diff v2.0.6-beta.8 HEAD -- package kitchen > "$probe_root/source-diff.patch"
          {
            date -u '+%Y-%m-%dT%H:%M:%SZ'
            git rev-parse HEAD
            git diff --name-only v2.0.6-beta.8 HEAD
            sw_vers
            uname -a
          } | tee "$probe_root/environment.log"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "ELECTROBUN_DIAGNOSTICS_TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: ./.github/actions/install-hutch
        with:
          channel: canary
      - name: Free macOS build disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          selected_xcode_root="$(cd "$(xcode-select -p)/../.." && pwd -P)"
          case "$selected_xcode_root" in
            /Applications/Xcode*.app) ;;
            *) echo "Unexpected selected Xcode root: $selected_xcode_root" >&2; exit 1 ;;
          esac
          for xcode_root in /Applications/Xcode_*.app; do
            [[ -d "$xcode_root" && ! -L "$xcode_root" ]] || continue
            resolved_xcode_root="$(cd "$xcode_root" && pwd -P)"
            case "$resolved_xcode_root" in
              /Applications/Xcode_*.app) ;;
              *) echo "Unexpected Xcode root: $resolved_xcode_root" >&2; exit 1 ;;
            esac
            if [[ "$resolved_xcode_root" != "$selected_xcode_root" ]]; then
              sudo rm -rf "$resolved_xcode_root"
            fi
          done
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$HOME/Library/Developer/Xcode/Archives"
          rm -rf "$HOME/Library/Developer/Xcode/iOS DeviceSupport"
          sudo rm -rf /Library/Developer/CoreSimulator/Caches
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes
          df -h /
      - name: Install package dependencies
        working-directory: package
        run: hutch run install
      - name: Build instrumented beta.8 and the selected Kitchen variant
        timeout-minutes: 45
        working-directory: package
        shell: bash
        run: |
          set -euo pipefail
          probe_root="$RUNNER_TEMP/macos-centering-probe"
          hutch --version | tee -a "$probe_root/environment.log"
          hutch build:dev 2>&1 | tee "$probe_root/package-build.log"
          cd ../kitchen
          npm ci 2>&1 | tee "$probe_root/kitchen-install.log"
          hutch scripts/kitchen-matrix.ts --build-only --with="$PROBE_VARIANT" --jobs=1 2>&1 | tee "$probe_root/kitchen-build.log"
      - name: Verify packaged Intel binaries
        shell: bash
        run: |
          set -euo pipefail
          node package/scripts/verify-macho-deployment-target.js --arch=x64 "kitchen/build/matrix/$PROBE_BUNDLE" 2>&1 | tee "$RUNNER_TEMP/macos-centering-probe/mach-o.log"
      - name: Repeat the full fullscreen-to-centering test sequence
        timeout-minutes: 35
        working-directory: kitchen
        shell: bash
        env:
          AUTO_RUN: '1'
        run: |
          set -euo pipefail
          unset AUTO_RUN_TEST_NAME AUTO_RUN_CATEGORY
          probe_root="$RUNNER_TEMP/macos-centering-probe"
          printf 'variant\tround\tstarted_utc\texit_status\telapsed_seconds\n' > "$probe_root/summary.tsv"
          for ((probe_iteration=1; probe_iteration<=PROBE_ROUNDS; probe_iteration++)); do
            probe_log="$probe_root/$PROBE_BUNDLE-$(printf '%02d' "$probe_iteration").log"
            probe_started_utc="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            probe_started_at="$(date +%s)"
            printf 'Starting %s full suite %s/%s at %s\n' "$PROBE_VARIANT" "$probe_iteration" "$PROBE_ROUNDS" "$probe_started_utc"
            # Existing filters select one exact test. A full suite preserves the
            # original fullscreen/centering order and all original assertions.
            if hutch scripts/kitchen-matrix.ts --launch-only --with="$PROBE_VARIANT" --timeout=1200 2>&1 | tee "$probe_log"; then
              probe_status=0
            else
              probe_status=$?
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' "$PROBE_VARIANT" "$probe_iteration" "$probe_started_utc" "$probe_status" "$(( $(date +%s) - probe_started_at ))" | tee -a "$probe_root/summary.tsv"
            if [[ "$probe_status" -ne 0 ]]; then
              printf 'Preserving the first failed %s suite; no retry of that result.\n' "$PROBE_VARIANT"
              exit "$probe_status"
            fi
          done
      - name: Collect fresh macOS crash reports
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          # ReportCrash writes asynchronously; this delay is only for artifact collection.
          sleep 5
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import shutil

          probe_root = Path(os.environ["RUNNER_TEMP"]) / "macos-centering-probe"
          destination = probe_root / "crash-reports"
          destination.mkdir(parents=True, exist_ok=True)
          started = probe_root / "started"
          if not started.exists():
              print("Probe never started; no crash reports selected")
              raise SystemExit(0)
          cutoff = started.stat().st_mtime
          roots = [("user", Path.home() / "Library/Logs/DiagnosticReports"),
                   ("system", Path("/Library/Logs/DiagnosticReports"))]
          selected = []
          for label, root in roots:
              if not root.exists():
                  continue
              for report in root.rglob("*"):
                  try:
                      if not report.is_file() or report.stat().st_mtime < cutoff:
                          continue
                      if report.suffix not in (".ips", ".crash"):
                          continue
                      # Preserve fresh WindowServer/Dock reports as well as app crashes.
                      target = destination / (label + "-" + "--".join(report.relative_to(root).parts))
                      shutil.copy2(report, target)
                      selected.append({"source": str(report), "saved": target.name,
                                       "modified": report.stat().st_mtime})
                  except (OSError, PermissionError) as error:
                      print(f"Could not inspect crash report {report}: {error}")
          (destination / "index.json").write_text(json.dumps({"started": cutoff, "reports": selected}, indent=2))
          print(f"Collected {len(selected)} fresh macOS crash reports")
          PYTHON
      - name: Upload centering diagnostics
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v6
        with:
          name: beta8-centering-${{ matrix.bundle }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/macos-centering-probe/**
            ${{ runner.temp }}/electrobun-kitchen-hang-*/**
            kitchen/test-results/**
