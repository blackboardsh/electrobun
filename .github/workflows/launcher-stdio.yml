name: Native installer and launcher

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact source commit or ref to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: launcher-stdio-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer and launcher (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            target: x86_64-windows-gnu
          - runner: windows-11-arm
            arch: arm64
            target: aarch64-windows-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: package/src/launcher
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false
      - name: Verify native runner and pinned compiler
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node -e 'if (process.arch !== process.env.EXPECTED_ARCH) throw new Error(`Expected ${process.env.EXPECTED_ARCH}, got ${process.arch}`)'
          if ($LASTEXITCODE -ne 0) { throw "Runner architecture mismatch" }
          if ((zig version).Trim() -ne '0.17.0') { throw "Unexpected Zig version" }
      - name: Build and test native launcher
        run: |
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe -j2 --summary all
          if ($LASTEXITCODE -ne 0) { throw "Launcher build failed" }
          zig build test -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe -j2 --summary all
          if ($LASTEXITCODE -ne 0) { throw "Launcher native tests failed" }
      - name: Verify redirected stdin, arguments, and full exit status
        env:
          ELECTROBUN_REQUIRE_TEST_LAUNCHER: '1'
        run: |
          $env:ELECTROBUN_TEST_LAUNCHER = (Resolve-Path zig-out/bin/launcher.exe).Path
          $env:ZIG_BINARY = (Get-Command zig).Source
          node --test arguments.integration.test.mjs windows_process_identity.integration.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Launcher process integration failed" }
      - name: Build native extractor and unattended installer
        working-directory: package/src/extractor
        run: |
          # Match the extractor target settings shipped by package/build.ts.
          zig build -Dtarget=${{ matrix.target }} -Dcpu=baseline -Doptimize=ReleaseFast -j2 --summary all
          if ($LASTEXITCODE -ne 0) { throw "Extractor and unattended installer build failed" }
      - name: Verify unattended installation with native binaries
        working-directory: package/src/extractor
        env:
          ELECTROBUN_REQUIRE_HEADLESS_INSTALLER: '1'
          ELECTROBUN_TEST_DISPOSABLE_WINDOWS_USER: '1'
        run: |
          $env:ELECTROBUN_TEST_HEADLESS_INSTALLER = (Resolve-Path zig-out/bin/headless-installer.exe).Path
          $env:ELECTROBUN_TEST_EXTRACTOR = (Resolve-Path zig-out/bin/extractor.exe).Path
          node --test headless-installer.integration.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Unattended installer integration failed" }
