name: Publish Electrobun npm bootstrap

on:
  push:
    tags:
      - 'npm-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Bootstrap tag to publish (for example npm-v2.0.0)'
        required: true

concurrency:
  group: electrobun-npm-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify independent bootstrap version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_TAG_PREFIX: npm-v
          RELEASE_PACKAGE_JSON: npm/electrobun/package.json
        run: node package/scripts/verify-release-version.mjs

      - name: Test and inspect npm package
        working-directory: npm/electrobun
        run: |
          node --test test/bootstrap.test.mjs test/package.test.mjs
          npm pack --dry-run --ignore-scripts

      - name: Publish npm bootstrap
        working-directory: npm/electrobun
        run: npm publish --access public --tag "${{ steps.release.outputs.dist-tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
