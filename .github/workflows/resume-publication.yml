name: Resume release publication
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Already published Electrobun tag
        required: true
      run_id:
        description: Release run containing validated Kitchen artifacts
        required: true
concurrency:
  group: electrobun-release
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify source release and completed acceptance matrix
        uses: actions/github-script@v8
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const run_id = Number(process.env.SOURCE_RUN_ID);
            if (!Number.isSafeInteger(run_id) || run_id <= 0) throw new Error('Invalid source run ID');
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id });
            const { execFileSync } = require('node:child_process');
            const revision = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            if (run.head_sha !== revision || run.path !== '.github/workflows/release.yml') {
              throw new Error('Source artifacts must come from the release workflow at the exact tag revision');
            }
            if (run.status !== 'completed') throw new Error('Stop the source publication run before recovery');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...repo, run_id, filter: 'all', per_page: 100,
            });
            const passed = new Set(jobs.filter(job => job.conclusion === 'success').map(job => job.name));
            if (!passed.has('release') || !passed.has('npm-publish') ||
                [...passed].filter(name => name.startsWith('build (')).length !== 5 ||
                [...passed].filter(name => name.startsWith('npm-acceptance (')).length !== 5) {
              throw new Error('Recovery requires all five builds and npm acceptance jobs plus GitHub/npm publication to have passed');
            }
      - name: Verify release identity
        id: release-type
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PACKAGE_JSON: package/package.json
          EXPLICIT_PRERELEASE: ${{ contains(inputs.tag, '-') }}
        run: node package/scripts/verify-release-version.mjs
      - name: Download the validated Kitchen artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: kitchen-*
          path: kitchen-artifacts
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: ./.github/actions/install-hutch
        with:
          channel: canary
      - name: Load the recovery uploader from this workflow revision
        env:
          RECOVERY_REVISION: ${{ github.sha }}
        run: |
          git show "$RECOVERY_REVISION:scripts/upload-kitchen-artifacts.ts" > scripts/upload-kitchen-artifacts.ts
          git show "$RECOVERY_REVISION:scripts/upload-kitchen-artifacts.test.ts" > scripts/upload-kitchen-artifacts.test.ts
      - name: Test the recovery uploader
        working-directory: package
        run: hutch test ../scripts/upload-kitchen-artifacts.test.ts
      - name: Recheck the current npm channel before publication
        env:
          NPM_DIST_TAG: ${{ steps.release-type.outputs.dist-tag }}
        run: |
          set -euo pipefail
          published_state="$(mktemp)"
          trap 'rm -f -- "$published_state"' EXIT
          node npm/scripts/check-published-bootstrap.mjs --manifest npm/electrobun/package.json --tag "$NPM_DIST_TAG" --output "$published_state"
          grep -Fxq 'exists=true' "$published_state"
      - name: Publish Kitchen artifacts using Bun and signed PUTs
        working-directory: package
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: hutch ../scripts/upload-kitchen-artifacts.ts ../kitchen-artifacts
      - name: Publish the matching template catalog
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/publish-templates.mjs

  template-acceptance:
    needs: [publish]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: windows-x64
          - os: windows-11-arm
            platform: windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify template acceptance version
        id: release-type
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PACKAGE_JSON: package/package.json
          EXPLICIT_PRERELEASE: ${{ contains(inputs.tag, '-') }}
        run: node package/scripts/verify-release-version.mjs
      - name: Test template acceptance harness
        run: node --test scripts/accept-published-template.test.mjs
      - name: Install Linux webview and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 xvfb xauth
      - name: Accept published templates on Linux
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: >-
          xvfb-run -a node scripts/accept-published-template.mjs
          --version "${{ steps.release-type.outputs.version }}"
          --platform "${{ matrix.platform }}"
          --output template-acceptance-results
      - name: Accept published templates on desktop
        if: runner.os != 'Linux'
        run: >-
          node scripts/accept-published-template.mjs
          --version "${{ steps.release-type.outputs.version }}"
          --platform "${{ matrix.platform }}"
          --output template-acceptance-results
      - name: Retain template acceptance reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: template-acceptance-${{ matrix.platform }}
          path: |
            template-acceptance-results/*.log
            template-acceptance-results/*.json
          if-no-files-found: warn
