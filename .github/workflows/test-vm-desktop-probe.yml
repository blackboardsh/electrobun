name: Windows ARM desktop probe

on:
  push:
    branches: [ci/test-vm-desktop-probe]
    paths: ['.github/workflows/test-vm-desktop-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - name: Inspect desktop and console attachment
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class DesktopProbe {
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Unicode)]
            public struct NotifyIconData {
              public uint size; public IntPtr hwnd; public uint id; public uint flags; public uint callback; public IntPtr icon;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=128)] public string tip;
              public uint state; public uint mask;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=256)] public string info;
              public uint version;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=64)] public string title;
              public uint infoFlags; public Guid guid; public IntPtr balloon;
            }
            [DllImport("shell32.dll", CharSet=CharSet.Unicode, SetLastError=true)] public static extern bool Shell_NotifyIcon(uint message, ref NotifyIconData data);
            public static bool TestTray(IntPtr hwnd, IntPtr icon) {
              var data = new NotifyIconData(); data.size=(uint)Marshal.SizeOf(typeof(NotifyIconData));
              data.hwnd=hwnd; data.id=4242; data.flags=7; data.callback=1025; data.icon=icon; data.tip="Electrobun native tray probe";
              bool added=Shell_NotifyIcon(0, ref data); if(added) Shell_NotifyIcon(2, ref data); return added;
            }
            [DllImport("kernel32.dll")] public static extern uint WTSGetActiveConsoleSessionId();
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder text, int count);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindow(string name, string title);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint process);
            [DllImport("user32.dll", SetLastError=true)] public static extern IntPtr OpenInputDesktop(uint flags, bool inherit, uint access);
            [DllImport("user32.dll", CharSet=CharSet.Unicode, SetLastError=true)] public static extern bool GetUserObjectInformation(IntPtr h, int index, StringBuilder data, int length, out int needed);
            [DllImport("user32.dll")] public static extern bool CloseDesktop(IntPtr h);
          }
          '@
          $outputDir = Join-Path $env:RUNNER_TEMP 'desktop-probe'
          New-Item -ItemType Directory -Force $outputDir | Out-Null
          $runnerSession = (Get-Process -Id $PID).SessionId
          function Inspect-Desktop([string]$label) {
            $console = [DesktopProbe]::WTSGetActiveConsoleSessionId()
            Write-Host "$label runner session=$runnerSession console session=$console"
            query session
            Get-Process explorer -ErrorAction SilentlyContinue | Select-Object Id, SessionId, ProcessName | Format-Table
            $foreground = [DesktopProbe]::GetForegroundWindow()
            $title = New-Object System.Text.StringBuilder 512
            [void][DesktopProbe]::GetWindowText($foreground, $title, 512)
            Write-Host "Foreground: $foreground $title"
            $desktop = [DesktopProbe]::OpenInputDesktop(0, $false, 1)
            $desktopName = New-Object System.Text.StringBuilder 512
            $needed = 0
            if ($desktop -ne [IntPtr]::Zero) {
              [void][DesktopProbe]::GetUserObjectInformation($desktop, 2, $desktopName, 1024, [ref]$needed)
              [void][DesktopProbe]::CloseDesktop($desktop)
            }
            Write-Host "Input desktop: $desktopName; error=$([Runtime.InteropServices.Marshal]::GetLastWin32Error())"
            $tray = [DesktopProbe]::FindWindow('Shell_TrayWnd', $null)
            [uint32]$trayPid = 0
            [void][DesktopProbe]::GetWindowThreadProcessId($tray, [ref]$trayPid)
            Write-Host "Tray HWND=$tray process=$trayPid"
            $form = New-Object System.Windows.Forms.Form
            $form.Text = 'Electrobun desktop probe'
            $form.StartPosition = 'Manual'
            $form.Location = New-Object System.Drawing.Point 100,100
            $form.ClientSize = New-Object System.Drawing.Size 400,300
            $form.BackColor = [System.Drawing.Color]::FromArgb(19,201,87)
            $form.TopMost = $true
            $form.Show()
            $form.Activate()
            $script:trayWorks = [DesktopProbe]::TestTray($form.Handle, [System.Drawing.SystemIcons]::Application.Handle)
            Write-Host "Native tray registration: $script:trayWorks"
            $icon = New-Object System.Windows.Forms.NotifyIcon
            $icon.Icon = [System.Drawing.SystemIcons]::Application
            $icon.Text = 'Electrobun desktop probe'
            $icon.Visible = $true
            for ($i=0; $i -lt 30; $i++) { [System.Windows.Forms.Application]::DoEvents(); Start-Sleep -Milliseconds 100 }
            $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $point = $form.PointToScreen((New-Object System.Drawing.Point 200,150))
              $pixel = $bitmap.GetPixel($point.X-$bounds.X, $point.Y-$bounds.Y)
              $script:pixelMatches = $pixel.R -eq 19 -and $pixel.G -eq 201 -and $pixel.B -eq 87
              Write-Host "Probe center pixel: $pixel expected R=19 G=201 B=87"
              $bitmap.Save((Join-Path $outputDir "$label.png"))
            } finally {
              $graphics.Dispose(); $bitmap.Dispose(); $icon.Dispose(); $form.Close(); $form.Dispose()
            }
          }
          Inspect-Desktop 'before'
          foreach ($root in @('HKLM:', 'HKCU:')) {
            $policy = "$root\SOFTWARE\Policies\Microsoft\Windows\OOBE"
            New-Item -Path $policy -Force | Out-Null
            New-ItemProperty -Path $policy -Name DisablePrivacyExperience -Value 1 -PropertyType DWord -Force | Out-Null
          }
          $setupProcesses = Get-Process -Name UserOOBEBroker,CloudExperienceHostBroker,WWAHost -ErrorAction SilentlyContinue | Where-Object SessionId -eq $runnerSession
          $setupProcesses | Select-Object Id, ProcessName, Path | Format-Table
          $setupProcesses | Stop-Process -Force
          Start-Sleep -Seconds 3
          # Dismissing first-login setup can leave the Start menu open above
          # topmost application windows. Close that shell flyout before testing.
          [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
          [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
          Start-Sleep -Seconds 1
          Inspect-Desktop 'after'
          if (-not $script:pixelMatches) { throw 'Probe window is not visible on the desktop.' }
          if (-not $script:trayWorks) { throw 'Native tray registration failed.' }
          exit 0
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-arm-desktop-probe
          path: ${{ runner.temp }}/desktop-probe/**
