name: Check Docs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/**'
      - 'package/src/**'
      - 'package/package.json'
      - 'package/scripts/verify-release-version.mjs'
      - '.github/actions/install-hutch/**'
      - '.github/workflows/docs-deploy.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'docs/**'
      - 'package/src/**'
      - 'package/package.json'
      - 'package/scripts/verify-release-version.mjs'
      - '.github/actions/install-hutch/**'
      - '.github/workflows/docs-deploy.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout electrobun
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify release tag and version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        id: release-type
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PACKAGE_JSON: package/package.json
        run: node package/scripts/verify-release-version.mjs

      - name: Install Hutch
        uses: ./.github/actions/install-hutch

      - name: Install docs dependencies
        run: hutch run install
        working-directory: docs

      - name: Test docs project boundary
        run: hutch run test:project-boundary
        working-directory: docs

      - name: Check docs
        run: hutch run check
        working-directory: docs

      - name: Build docs
        run: hutch run build
        working-directory: docs
