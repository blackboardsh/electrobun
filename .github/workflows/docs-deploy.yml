name: Deploy Docs

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Where to publish'
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          startsWith(github.ref, 'refs/tags/v') &&
          !contains(github.ref_name, '-beta') &&
          !contains(github.ref_name, '-alpha') &&
          !contains(github.ref_name, '-rc')
        )
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout electrobun
        uses: actions/checkout@v6

      - name: Resolve Cloudflare Pages branch
        id: deploy-branch
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "branch=main" >> $GITHUB_OUTPUT
          elif [[ "${DEPLOY_ENVIRONMENT}" == "production" ]]; then
            echo "branch=main" >> $GITHUB_OUTPUT
          else
            echo "branch=preview" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Hutch
        uses: ./.github/actions/install-hutch

      - name: Install docs dependencies
        run: hutch install --frozen-lockfile
        working-directory: docs

      - name: Check docs
        run: hutch run check
        working-directory: docs

      - name: Build docs
        run: hutch run build
        working-directory: docs

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_BRANCH: ${{ steps.deploy-branch.outputs.branch }}
        run: hutch run deploy
        working-directory: docs
